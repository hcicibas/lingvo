<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#9B59B6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>
  <!-- Letter L -->
  <text x="140" y="340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" font-size="280" fill="white" letter-spacing="-8">L</text>
  <!-- Small globe/translation icon -->
  <circle cx="370" cy="175" r="65" fill="none" stroke="white" stroke-width="12" opacity="0.9"/>
  <ellipse cx="370" cy="175" rx="30" ry="65" fill="none" stroke="white" stroke-width="10" opacity="0.7"/>
  <line x1="305" y1="175" x2="435" y2="175" stroke="white" stroke-width="10" opacity="0.7"/>
  <!-- Dot accent -->
  <circle cx="390" cy="380" r="22" fill="white" opacity="0.85"/>
</svg>
